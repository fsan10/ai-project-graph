name: 缺陷报告
description: 报告可稳定复现的异常行为
title: "[缺陷] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 请说明实际结果与预期结果。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察……
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: Windows 11 / Chrome 版本 / Codex 宿主版本
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 截图或日志
      description: 请移除令牌、路径中的个人信息等敏感内容。
